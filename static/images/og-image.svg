    <rect x="7" y="15" width="6" height="15" fill="#FFFFFF"/>
    <rect x="5.5" y="13" width="9" height="2" fill="#FFFFFF"/>
    <rect x="27" y="15" width="6" height="15" fill="#FFFFFF"/>
    <rect x="25.5" y="13" width="9" height="2" fill="#FFFFFF"/>
